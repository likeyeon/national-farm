<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국립농산물품질관리원</title>
    <script
      src="https://kit.fontawesome.com/f0c26c0bfa.js"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/ungveloper/web-fonts/GmarketSans/font-face.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/ungveloper/web-fonts/GmarketSans/font-family.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="row">
          <div class="col">
            <div class="header-top lg-only">
              <div class="header-top-left">
                <div class="agency-select">
                  <span class="agency-selected">관련기관</span>
                  <ul class="agency-listbox" role="listbox">
                    <li
                      class="focus"
                      data-href="/"
                      data-value="관련기관"
                      role="option"
                    >
                      관련기관
                    </li>
                    <li data-href="/" data-value="중앙행정기관" role="option">
                      중앙행정기관
                    </li>
                    <li data-href="/" data-value="국내관련기관" role="option">
                      국내관련기관
                    </li>
                    <li data-href="/" data-value="해외관련기관" role="option">
                      해외관련기관
                    </li>
                  </ul>
                </div>
              </div>

              <div class="header-top-right">
                <ul class="util-group">
                  <li class="font-size">
                    <button aria-label="화면 확대">
                      <i class="fa-solid fa-plus fa-xs" aria-hidden></i>
                    </button>
                    <button aria-label="화면 축소">
                      <i class="fa-solid fa-minus fa-xs" aria-hidden></i>
                    </button>
                    <button aria-label="화면 초기화">
                      <i class="fa-solid fa-rotate-right fa-xs" aria-hidden></i>
                    </button>
                    <span>화면크기</span>
                  </li>
                  <li class="print">
                    <button>
                      <img src="./assets/images/icons/print.svg" alt="인쇄" />
                      인쇄하기
                    </button>
                  </li>
                  <li class="lang">
                    <img src="./assets/images/icons/lang.svg" alt="언어" />
                    <button class="kor">KOR</button>
                    <button class="eng">ENG</button>
                  </li>
                  <li class="all-menu">
                    <a href="/">
                      <i class="fa-solid fa-bars fa-lg"></i>전체메뉴
                    </a>
                  </li>
                </ul>
              </div>
            </div>

            <div class="header-main">
              <div class="header-main-left">
                <h1 class="logo">
                  <span class="visually-hidden">국립농산물품질관리원</span>
                  <a href="/">
                    <img
                      src="./assets/images/logo.svg"
                      alt="국립농산물품질관리원 로고"
                    />
                  </a>
                  <a href="/">
                    <img src="./assets/images/logo-mark.png" alt="국정목표" />
                  </a>
                </h1>
                <nav class="gnb">
                  <h2 class="visually-hidden">메뉴</h2>
                  <ul class="menus">
                    <li class="depth1">
                      <a href="/">업무소개</a>
                    </li>
                    <li class="depth1"><a href="/">정보공개</a></li>
                    <li class="depth1"><a href="/">알림·소식</a></li>
                    <li class="depth1"><a href="/">기관소개</a></li>
                  </ul>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <script src="./js/gnb-select.js"></script>
  </body>
</html>
