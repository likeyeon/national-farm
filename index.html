<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>국립농산물품질관리원</title>
    <script
      src="https://kit.fontawesome.com/f0c26c0bfa.js"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/ungveloper/web-fonts/GmarketSans/font-face.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/ungveloper/web-fonts/GmarketSans/font-family.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="gnb">
        <div class="container">
          <div class="row">
            <div class="col">
              <div class="gnb-top lg-only">
                <div class="gnb-top-left">
                  <div class="agency-group">
                    <select name="agency" id="agency">
                      <option value="1">관련기관</option>
                      <option value="2">중앙행정기관</option>
                      <option value="3">국내관련기관</option>
                      <option value="4">해외관련기관</option>
                    </select>
                  </div>
                </div>

                <div class="gnb-top-right">
                  <ul class="util-group">
                    <li class="font-size">
                      <button aria-label="화면 확대">
                        <i class="fa-solid fa-plus" aria-hidden></i>
                      </button>
                      <button aria-label="화면 축소">
                        <i class="fa-solid fa-minus" aria-hidden></i>
                      </button>
                      <button aria-label="화면 초기화">
                        <i class="fa-solid fa-rotate-right" aria-hidden></i>
                      </button>
                      <span>화면크기</span>
                    </li>
                    <li class="print">
                      <button>
                        <img src="./assets/images/icons/print.svg" alt="인쇄" />
                        인쇄하기
                      </button>
                    </li>
                    <li class="lang">
                      <img src="./assets/images/icons/lang.svg" alt="언어" />
                      <button>KOR</button>
                      <button>ENG</button>
                    </li>
                    <li class="menu">
                      <button><i class="fa-solid fa-bars"></i>전체메뉴</button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
